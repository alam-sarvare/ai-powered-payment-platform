name: Payment Platform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0

        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.4.0

        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

        ports:
          - 9092:9092

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout source code
        uses: actions/checkout@v5


      # -------------------------
      # Java
      # -------------------------

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # -------------------------
      # Build + Test
      # -------------------------

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

          SPRING_KAFKA_CONSUMER_GROUP_ID: payment-group

          SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest

        run: |
          chmod +x mvnw
          ./mvnw clean verify


      # -------------------------
      # Docker
      # -------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

          tags: |
            payment-platform:latest
            payment-platform:${{ github.sha }}

          outputs: type=docker,dest=/tmp/payment-platform.tar


      # -------------------------
      # Upload Docker image
      # -------------------------

      - name: Upload Docker image
        uses: actions/upload-artifact@v5
        with:
          name: payment-platform-docker-image
          path: /tmp/payment-platform.tar
          retention-days: 7