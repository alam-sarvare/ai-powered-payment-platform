name: Build & Push Docker Image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:

      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: payment_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      zookeeper:
        image: confluentinc/cp-zookeeper:7.4.0

        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

        ports:
          - 2181:2181


      kafka:
        image: confluentinc/cp-kafka:7.4.0

        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

        ports:
          - 9092:9092


    steps:

      # -----------------------------------
      # 1. Checkout code
      # -----------------------------------

      - name: Checkout code
        uses: actions/checkout@v5


      # -----------------------------------
      # 2. Setup Java
      # -----------------------------------

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # -----------------------------------
      # 3. Build Spring Boot application
      # -----------------------------------

      - name: Build with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payment_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: admin

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_KAFKA_CONSUMER_GROUP_ID: payment-group
          SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest

        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests


      # -----------------------------------
      # 4. Setup Docker Buildx
      # -----------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # -----------------------------------
      # 5. Login to GitHub Container Registry
      # -----------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------
      # 6. Build and Push Docker Image
      # -----------------------------------

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/payment-platform:latest
            ghcr.io/${{ github.repository_owner }}/payment-platform:${{ github.sha }}