#Application name
spring.application.name=payment-platform

# Server port
server.port=8080

# ===============================
# PostgreSQL Database
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
# Outbox polling: base delay between polls (ms). Idle polls back off automatically up to 12x this value.
outbox.publisher.fixed-delay-ms=5000

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.info.env.enabled=true

info.app.name=AI Payment Platform
info.app.description=AI-powered payment processing platform
info.app.version=1.0.0

# ==========================================
# Redis
# ==========================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

#Spring Security OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=

# ==========================================
# Kafka
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.alam.payment
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3

# Reduce reconnect spam when Kafka is unavailable locally
spring.kafka.consumer.properties.reconnect.backoff.ms=5000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=30000
spring.kafka.producer.properties.reconnect.backoff.ms=5000
spring.kafka.producer.properties.reconnect.backoff.max.ms=30000
spring.kafka.admin.properties.reconnect.backoff.ms=5000
spring.kafka.admin.properties.reconnect.backoff.max.ms=30000
# Do not fail app startup if Kafka is unavailable
spring.kafka.admin.fail-fast=false
spring.kafka.listener.auto-startup=true

# ==========================================
# Spring AI - Groq (Free alternative to OpenAI)
# Get your FREE key at: https://console.groq.com/keys
# ==========================================
spring.ai.openai.api-key=${GROQ_API_KEY:gsk_your_actual_key_here}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile


# Logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{X-Correlation-ID}] - %msg%n
